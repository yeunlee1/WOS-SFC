# 역할 — 앱(NestJS + 웹 정적 빌드) · MySQL · Caddy 리버스 프록시를 한 번에 띄우는 배포 구성.
#
# 값은 저장소 루트의 .env 에서 읽는다(.env.example 를 복사해 채운다).
# ${VAR:?...} 는 값이 비면 compose 가 즉시 실패하게 만든다 — 조용히 빈 비밀번호로
# 뜨는 것보다 기동 실패가 낫다.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # 컨테이너 로그 회전. 없으면 json-file 로그가 무한히 쌓여 디스크를 채운다.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # OOM 이 나면 mysqld 가 아니라 이 상한을 넘은 컨테이너만 죽는다. 첫 배포 뒤 docker stats 로 조정.
    mem_limit: 1g
    # 한글 닉네임·채팅·공지가 들어가므로 utf8mb4 를 서버 기본값으로 고정한다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD 를 .env 에 설정하세요}
      MYSQL_DATABASE: ${DATABASE_NAME:?DATABASE_NAME 을 .env 에 설정하세요}
      MYSQL_USER: ${DATABASE_USER:?DATABASE_USER 를 .env 에 설정하세요}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD 를 .env 에 설정하세요}
    volumes:
      # [영속 1/3] DB 데이터. 이게 없으면 계정·채팅·공지·집결그룹이 전부 사라진다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping 은 초기화 도중에도 성공한다. 앱 계정으로 대상 DB 에 붙어
      # 실제 질의가 되는지까지 봐야 "마이그레이션을 돌려도 되는 상태"가 보장된다.
      # $$ 는 compose 의 변수 치환을 피해 컨테이너 셸에 $ 하나로 전달하기 위한 것이다.
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e 'SELECT 1' "$$MYSQL_DATABASE"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 768m
    depends_on:
      db:
        # DB 헬스체크가 통과한 뒤에만 앱 컨테이너가 시작된다.
        # entrypoint 의 wait-for-db.js 는 compose 를 쓰지 않는 배포(PaaS)를 위한 이중 안전장치다.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # 컨테이너 사이 통신이라 서비스 이름으로 붙는다. .env 의 DATABASE_HOST 는 무시된다.
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER 를 .env 에 설정하세요}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD 를 .env 에 설정하세요}
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME 을 .env 에 설정하세요}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      # production 에서 WEB_ORIGIN 이 없으면 server/src/main.ts 가 부팅을 거부한다.
      # 브라우저가 실제로 여는 주소(스킴·호스트·포트)와 정확히 같아야 한다 —
      # socket-cors.options.ts 가 같은 값으로 WebSocket 핸드셰이크도 검사하기 때문이다.
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN 을 .env 에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 설정하세요}
      SERVER_CODE: ${SERVER_CODE:?SERVER_CODE 를 .env 에 설정하세요}
      # 이 구성의 프록시는 Caddy 한 단이므로 1이다.
      # 앞에 Cloudflare 같은 CDN 을 한 단 더 두면 2가 된다. 그때는 deploy/Caddyfile 의
      # trusted_proxies 도 함께 켜야 한다 — 켜지 않으면 Caddy 가 CDN 의 XFF 를 버려서
      # 홉 수만 2로 올려도 진짜 클라이언트 IP 가 복구되지 않는다.
      # 값을 모르면 배포 직후 `docker compose logs app` 의 [trust proxy 진단] 을 보면 된다.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      TTS_CACHE_DIR: /app/server/tts-cache
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-}
      MIGRATE_CMD: ${MIGRATE_CMD:-npm run migrate}
      # deploy/wait-for-db.js 가 읽는다. compose 는 .env 를 치환에만 쓰므로 여기서 넘겨야 컨테이너에 들어간다.
      DB_WAIT_TIMEOUT_SEC: ${DB_WAIT_TIMEOUT_SEC:-120}
    volumes:
      # [영속 2/3] 업로드 이미지. server/src/storage-paths.ts 의 UPLOAD_ROOT.
      - uploads:/app/uploads
      # [영속 3/3] TTS mp3 캐시. 날아가면 재생성에 27분이 걸리고 그동안 음성이 안 나온다.
      - tts-cache:/app/server/tts-cache
    # 호스트에 포트를 열지 않는다. 외부 노출은 proxy 만 담당한다.
    expose:
      - "3001"
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 256m
    depends_on:
      app:
        # Dockerfile 의 HEALTHCHECK(/time)가 통과한 뒤 트래픽을 받는다.
        condition: service_healthy
    environment:
      # 비우면 Caddyfile 기본값 :80 이 쓰인다(도메인 없이 평문 HTTP).
      # 도메인을 넣으면 자동 HTTPS 가 켜진다.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # 검증이나 포트 충돌 회피가 필요하면 .env 에서 HTTP_PORT/HTTPS_PORT 를 바꾼다.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3(QUIC). 자동 HTTPS 를 쓸 때만 의미가 있다.
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 TLS 인증서 보관. 이게 없으면 컨테이너를 새로 만들 때마다 재발급을
      # 시도해 Let's Encrypt 발급 한도에 걸린다. 영속 3종에는 안 들어가지만 필요하다.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  mysql-data:
  uploads:
  tts-cache:
  caddy-data:
  caddy-config:

networks:
  internal:
